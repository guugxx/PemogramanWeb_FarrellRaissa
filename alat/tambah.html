<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pinjam ID | Tambah Alat</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>Pinjam ID</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Alat</a></li>
                <li><a href="tambah.html">Tambah Alat</a></li>
                <li><a href="../penyewa/list.html">Daftar Penyewa</a></li>
                <li><a href="../penyewa/tambah.html">Tambah Penyewa</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Alat</h2>
            <form id="form-tambah">
                <p>
                    <label for="nama">Nama Alat</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="kategori">Kategori</label><br>
                    <input type="text" id="kategori" name="kategori" required>
                </p>
                <p>
                    <label for="kondisi">Kondisi</label><br>
                    <input type="text" id="kondisi" name="kondisi">
                </p>
                <p>
                    <label for="stok">Stok</label><br>
                    <input type="number" id="stok" name="stok">
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Pinjam ID &mdash; Farrell &amp; Raissa</p>
    </footer>
    <script src="../assets/js/app.js"></script>
</body>
</html>
